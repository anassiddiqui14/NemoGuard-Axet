version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nemoguard-postgres
    environment:
      POSTGRES_USER: nemoguard
      POSTGRES_PASSWORD: nemoguard_password
      POSTGRES_DB: nemoguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemoguard -d nemoguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/admin-tools:latest
    container_name: nemoguard-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - TEMPORAL_CLI_ADDRESS=localhost:7233
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nemoguard-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql://nemoguard:nemoguard_password@postgres:5432/nemoguard_db
      - TEMPORAL_URL=temporal:7233
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ENV=${ENV:-production}
      # Opt-in: set to 1 (and run with --profile lab) to make
      # execute_simulated_action / verify_incident_recovery call into the
      # LocalStack lab for real remediation + verification instead of no-ops.
      - NEMOGUARD_LOCALSTACK_LAB=${NEMOGUARD_LOCALSTACK_LAB:-0}
      - LOCALSTACK_ENDPOINT=http://localstack:4566

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    container_name: nemoguard-temporal-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql://nemoguard:nemoguard_password@postgres:5432/nemoguard_db
      - TEMPORAL_URL=temporal:7233
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}

  frontend:
    build:
      context: ./renderer
      dockerfile: Dockerfile.frontend
    container_name: nemoguard-frontend
    ports:
      - "80:80"

  simulator:
    build:
      # Build context is the repository root (not ./simulator_backend)
      # so this standalone container can COPY the shared backend/
      # package -- giving it access to the real, proven
      # backend.app.domain.agents.base_agent.BaseAgent aXet integration
      # instead of maintaining a second, duplicated implementation.
      context: .
      dockerfile: simulator_backend/Dockerfile.simulator
    container_name: nemoguard-simulator
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_URL=postgresql://nemoguard:nemoguard_password@postgres:5432/nemoguard_db
      # The Scenario Cockpit GenAI Incident Generator (generate_and_inject_ai)
      # now calls the NTT aXet-managed LLM via the same BaseAgent integration
      # used by every real NemoGuard agent, instead of the legacy NVIDIA
      # Nemotron API -- these are injected by the aXet Python Agent runtime
      # into every container's environment; no value is hardcoded here.
      - AXET_LLM_BASE_URL=${AXET_LLM_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AXET_MODEL=${AXET_MODEL:-}
      - AXET_PROJECT_ID=${AXET_PROJECT_ID:-}
      - AXET_USER_ID=${AXET_USER_ID:-}
      - DEPTAPPS_WEB_BACKEND_JWT_TOKEN=${DEPTAPPS_WEB_BACKEND_JWT_TOKEN:-}
      - NEMOGUARD_API_BASE=${NEMOGUARD_API_BASE:-http://api:8000}

  # --- LocalStack lab (real-AWS-API simulation for effectiveness testing) ---
  # See localstack_lab/README.md. Provides real S3/Lambda/CloudWatch/SNS/SQS
  # emulation so a genuine data-pipeline job can genuinely fail and be
  # genuinely remediated by NemoGuard's agents, instead of relying only on
  # scripted webhook payloads. Opt-in: start with
  #   docker compose --profile lab up -d
  localstack:
    image: localstack/localstack:3
    container_name: nemoguard-localstack
    profiles: ["lab"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,cloudwatch,sns,sqs,logs,iam,sts,stepfunctions,secretsmanager
      - DEBUG=0
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_DOCKER_NETWORK=pipeline-copilot_default
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
